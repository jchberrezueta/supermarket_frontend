<div class="security-page">
  <section class="security-card">
    <div class="security-icon">
      <mat-icon> mark_email_read </mat-icon>
    </div>

    <h1>Recuperar contraseña</h1>

    <p class="subtitle">
      Ingresa tu nombre de usuario. Si la cuenta tiene un correo registrado,
      enviaremos un enlace válido durante 15 minutos.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="usuario"> Nombre de usuario </label>

      <input
        id="usuario"
        class="text-input"
        type="text"
        formControlName="usuario"
        autocomplete="username"
        maxlength="25"
      />

      @if (errorMessage) {
        <div class="message error-message">
          {{ errorMessage }}
        </div>
      }

      @if (message) {
        <div class="message success-message">
          {{ message }}
        </div>
      }

      <div class="actions">
        <button
          type="button"
          class="secondary-button"
          (click)="volverLogin()"
          [disabled]="isSubmitting"
        >
          Volver
        </button>

        <button
          type="submit"
          class="primary-button"
          [disabled]="isSubmitting || form.disabled"
        >
          @if (isSubmitting) {
            Enviando...
          } @else {
            Enviar enlace
          }
        </button>
      </div>
    </form>
  </section>
</div>
