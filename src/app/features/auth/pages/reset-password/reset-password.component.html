<div class="security-page">
  <section class="security-card">
    <div class="security-icon">
      <mat-icon> password </mat-icon>
    </div>

    <h1>Restablecer contraseña</h1>

    <p class="subtitle">
      Define una contraseña nueva para recuperar el acceso a tu cuenta.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="nuevaClave"> Nueva contraseña </label>

      <div class="password-field">
        <input
          id="nuevaClave"
          formControlName="nuevaClave"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="new-password"
        />

        <button
          type="button"
          class="visibility-button"
          (click)="showPassword = !showPassword"
        >
          <mat-icon>
            {{ showPassword ? "visibility_off" : "visibility" }}
          </mat-icon>
        </button>
      </div>

      <label for="confirmarClave"> Confirmar contraseña </label>

      <div class="password-field">
        <input
          id="confirmarClave"
          formControlName="confirmarClave"
          [type]="showConfirmation ? 'text' : 'password'"
          autocomplete="new-password"
        />

        <button
          type="button"
          class="visibility-button"
          (click)="showConfirmation = !showConfirmation"
        >
          <mat-icon>
            {{ showConfirmation ? "visibility_off" : "visibility" }}
          </mat-icon>
        </button>
      </div>

      <ul class="password-rules">
        <li>Mínimo 8 caracteres.</li>
        <li>Una mayúscula y una minúscula.</li>
        <li>Un número.</li>
        <li>Un carácter especial.</li>
      </ul>

      @if (errorMessage) {
        <div class="message error-message">
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="message success-message">
          {{ successMessage }}
        </div>
      }

      <div class="actions">
        <button
          type="button"
          class="secondary-button"
          (click)="volverLogin()"
          [disabled]="isSubmitting"
        >
          Volver
        </button>

        <button
          type="submit"
          class="primary-button"
          [disabled]="isSubmitting || form.disabled"
        >
          @if (isSubmitting) {
            Guardando...
          } @else {
            Restablecer
          }
        </button>
      </div>
    </form>
  </section>
</div>
