<div class="div_container">
  <ui-card [showHeader]="false" class="div_card">
    <!-- CABECERA SUPERIOR -->
    <div class="top_bar">
      <ui-text-field
        class="field_empresa"
        [label]="'Empresa'"
        [value]="nombreEmpresa"
        [disabled]="true"
      />

      <ng-container [formGroup]="formData">
        <ui-input-box
          [label]="'Producto'"
          [options]="productos"
          formControlName="ideProd"
        />
      </ng-container>

      <ui-button
        icon="refresh"
        [color]="'primary'"
        (evntClick)="refreshData()"
      />

      <ui-button
        icon="edit"
        [color]="'primary'"
        (evntClick)="changeModeUpdate()"
      />

      <ui-button
        icon="add"
        [color]="'green'"
        (evntClick)="changeModeInsert()"
      />

      <div class="mode_badge" [class.add]="isAdd" [class.update]="!isAdd">
        {{ isAdd ? "INSERTANDO" : "ACTUALIZANDO" }}
      </div>
    </div>

    <!-- FORMULARIO -->
    <div class="card_form">
      <form [formGroup]="formData" class="form">
        <div class="form_fields">
          <ui-text-field
            label="Precio de compra unitario"
            valueType="number"
            formControlName="precioCompraProd"
          />

          <ui-text-field
            label="Descuento de compra unitario"
            valueType="number"
            formControlName="dctoCompraProd"
          />

          <ui-text-field
            label="Descuento por caducidad unitario"
            valueType="number"
            formControlName="dctoCaducidadProd"
          />

          <ui-text-field
            label="IVA (%)"
            valueType="number"
            formControlName="ivaProd"
          />
        </div>

        <div class="form_buttons">
          <div class="d1">
            <ui-button
              [label]="isAdd ? 'Agregar' : 'Actualizar'"
              [color]="isAdd ? 'primary' : 'yellow'"
              [textColor]="isAdd ? 'white' : 'black'"
              icon="save"
              (evntClick)="guardar()"
            />
          </div>
          <div class="d2">
            <ui-button
              [label]="'Volver'"
              [color]="'red'"
              icon="close"
              (evntClick)="volver()"
            />
            <ui-combo-box
              [label]="'Estado'"
              [options]="estadosPreciosProds"
              class="ui-combo-box"
              formControlName="estadoEmprProd"
            />
          </div>
        </div>
      </form>
    </div>

    <!-- TABLA -->
    <div class="card_table">
      <ui-table-list
        #tableList
        [serviceApi]="'empresas/listar/precios/' + idEmpresa"
        [columns]="config.columns"
        [isSelection]="true"
        (rowClickAction)="setIdEmprProd($event)"
      />
    </div>
  </ui-card>
</div>
