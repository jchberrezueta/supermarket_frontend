<div class="div_container">
  <div class="div_card">
    <div class="panel_1">
      <div class="card_form">
        <form [formGroup]="formData" class="form">
          <div class="div_form">
            <div class="form_info">
              @if (!isAdd) {
                <div class="form_row">
                  <div class="form_div">
                    <ui-text-field
                      [label]="'ID'"
                      formControlName="ideProv"
                      [readonly]="true"
                    />
                  </div>

                  <div class="form_div"></div>
                </div>
              }
              <div class="form_row">
                <div class="form_div">
                  <ui-combo-box
                    [label]="'Empresa'"
                    [options]="empresas"
                    formControlName="ideEmpr"
                  />

                  <ui-text-field
                    [label]="'Primer Nombre'"
                    formControlName="primerNombreProv"
                  />

                  <ui-text-field
                    [label]="'Segundo Nombre'"
                    formControlName="segundoNombreProv"
                  />

                  <ui-datetime-picker
                    [label]="'Fecha Nacimiento'"
                    [isTime]="false"
                    formControlName="fechaNacimientoProv"
                  />

                  <ui-text-field
                    [label]="'Teléfono'"
                    formControlName="telefonoProv"
                  />
                  <ui-combo-box
                    [label]="'Estado'"
                    [options]="estadosProveedor"
                    formControlName="estadoProv"
                  />
                </div>

                <div class="form_div">
                  <ui-text-field
                    [label]="'Cédula'"
                    formControlName="cedulaProv"
                  />
                  <ui-text-field
                    [label]="'Apellido Paterno'"
                    formControlName="apellidoPaternoProv"
                  />

                  <ui-text-field
                    [label]="'Apellido Materno'"
                    formControlName="apellidoMaternoProv"
                  />

                  <ui-text-field
                    [label]="'Edad'"
                    [valueType]="'number'"
                    formControlName="edadProv"
                  />

                  <ui-text-field
                    [label]="'Email'"
                    formControlName="emailProv"
                  />

                  <ui-text-field
                    [label]="'Cargo laboral'"
                    formControlName="cargoProv"
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="form_buttons">
            <ui-button
              [label]="isAdd ? 'Guardar' : 'Actualizar'"
              (evntClick)="guardar()"
            />
            <ui-button
              [label]="'Cancelar'"
              [color]="'red'"
              (evntClick)="cancelar()"
            />
          </div>
        </form>
      </div>
    </div>

    <div class="panel_2">
      <div class="panel_2_img"></div>
    </div>
  </div>
</div>
