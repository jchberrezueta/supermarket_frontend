<div class="sm-crud-list">
  <ui-card [showHeader]="true" class="sm-crud-card">
    <div class="sm-crud-toolbar" card-header>
      <form class="sm-crud-form" [formGroup]="formData" (ngSubmit)="filtrar()">
        <div class="sm-crud-filter-row">
          <div class="sm-crud-filters">
            <ui-input-box
              class="sm-field-lg"
              label="Producto"
              [options]="opcionesProductos"
              [returnValue]="'label'"
              formControlName="producto"
            />

            <ui-text-field
              class="sm-field-sm"
              label="ID lote"
              valueType="number"
              formControlName="ideLote"
            />

            <ui-combo-box
              class="sm-field-lg"
              label="Tipo de movimiento"
              [options]="opcionesTipos"
              formControlName="tipoMovi"
            />

            <ui-text-field
              class="sm-field-sm"
              label="Usuario"
              formControlName="usuaIngre"
            />

            <ui-datetime-picker
              class="sm-field-date"
              label="Desde"
              formControlName="fechaDesde"
              [isTime]="false"
            />

            <ui-datetime-picker
              class="sm-field-date"
              label="Hasta"
              formControlName="fechaHasta"
              [isTime]="false"
            />
          </div>

          <div class="sm-crud-filter-button">
            <ui-button
              label="Filtrar"
              icon="filter_alt"
              action="filter"
              (evntClick)="filtrar()"
            />
          </div>
        </div>
      </form>

      <div class="sm-crud-actions">
        <ui-button
          icon="refresh"
          action="refresh"
          (evntClick)="refreshData($event)"
        />
      </div>
    </div>

    <div class="sm-crud-table">
      <ui-table-list
        #tableList
        [serviceApi]="'movimientos-inventario'"
        [serviceApiFilter]="'movimientos-inventario/filtrar'"
        [serviceApiReal]="'movimientos-inventario'"
        [columns]="config.columns"
      />
    </div>
  </ui-card>
</div>
