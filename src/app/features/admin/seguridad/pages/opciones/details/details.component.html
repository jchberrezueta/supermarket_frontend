<div class="details-container">
  <div class="details-header">
    <h2>Detalles de la Opción</h2>
    <ui-button label="Volver" icon="arrow_back" (evntClick)="goBack()">
    </ui-button>
  </div>

  @if (opcion) {
    <div class="details-content">
      <div class="form-row">
        <ui-text-field
          label="ID"
          [value]="opcion.ide_opci.toString()"
          [readonly]="true"
        >
        </ui-text-field>

        <ui-text-field
          label="Nombre"
          [value]="opcion.nombre_opci"
          [readonly]="true"
        >
        </ui-text-field>
      </div>

      <div class="form-row">
        <ui-text-field
          label="Ruta"
          [value]="opcion.ruta_opci"
          [readonly]="true"
        >
        </ui-text-field>

        <ui-text-field
          label="Nivel"
          [value]="opcion.nivel_opci.toString()"
          [readonly]="true"
        >
        </ui-text-field>
      </div>

      <div class="form-row">
        <ui-text-field
          label="Padre (ID)"
          [value]="opcion.padre_opci?.toString() ?? 'Ninguno'"
          [readonly]="true"
        >
        </ui-text-field>

        <ui-text-field
          label="Icono"
          [value]="opcion.icono_opci ?? 'Ninguno'"
          [readonly]="true"
        >
        </ui-text-field>
      </div>

      <div class="form-row">
        <ui-text-field
          label="Estado"
          [value]="opcion.activo_opci === 'si' ? 'Activo' : 'Inactivo'"
          [readonly]="true"
        >
        </ui-text-field>
      </div>

      <div class="form-row">
        <ui-text-field
          label="Estado"
          [value]="opcion.activo_opci === 'si' ? 'Activo' : 'Inactivo'"
          [readonly]="true"
        />

        <ui-text-field
          label="Visible en menú"
          [value]="opcion.visible_opci ? 'Sí' : 'No'"
          [readonly]="true"
        />
      </div>

      <div class="form-row full-width">
        <ui-text-area
          label="Descripción"
          [value]="opcion.descripcion_opci"
          [readonly]="true"
        >
        </ui-text-area>
      </div>
    </div>
  }
</div>
